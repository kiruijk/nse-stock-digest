name: Update NSE Data Daily

# No push trigger: code/content pushes already include locally rendered pages, and a
# push-triggered run would race with them. Use "Run workflow" for an immediate refresh.
on:
  schedule:
    # 7:00 PM EAT (16:00 UTC) on weekdays; the NSE closes at 3:00 PM EAT and the price
    # source publishes the day's figures in the afternoon
    - cron: "0 16 * * MON-FRI"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-stocks:
    runs-on: ubuntu-latest
    # Detail refreshes wait 60s between requests (the source's crawl delay): ~12 min at 6/run
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      # Tests first: a failing test stops the run before anything is fetched or published
      - name: Run tests
        run: npm test

      - name: Run stock update script
        run: node update-stocks.js

      - name: Commit and push changes
        run: |
          git config --local user.name "Stock Bot"
          git config --local user.email "bot@github.com"
          FILES="index.html sitemap.xml robots.txt stocks/ sectors/ data/market.json data/history/ data/details/"
          MESSAGE="🤖 Update NSE prices and news - $(date +'%Y-%m-%d %H:%M:%S')"
          git add $FILES
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "$MESSAGE"
          pushed=""
          for attempt in 1 2 3; do
            if git push; then pushed=1; break; fi
            # Someone pushed during the run (it takes ~12 min). Start again from the remote
            # and merge this run's data into it file by file (never a line-level git merge
            # of JSON), then rebuild the pages with the remote's templates.
            echo "Push rejected; merging onto the latest remote (attempt $attempt)"
            rm -rf "$RUNNER_TEMP/bot-data" && cp -r data "$RUNNER_TEMP/bot-data"
            git fetch origin main && git reset --hard origin/main
            node merge-bot-data.js "$RUNNER_TEMP/bot-data"
            node update-stocks.js --render-only
            git add $FILES
            git diff --cached --quiet || git commit -m "$MESSAGE"
          done
          [ -n "$pushed" ] || { echo "::error::Could not push the update after 3 attempts"; exit 1; }

      # Runs after the commit so good data is still saved; a failure here turns the run
      # red and triggers GitHub's failed-workflow email
      - name: Check data freshness
        run: node check-freshness.js
